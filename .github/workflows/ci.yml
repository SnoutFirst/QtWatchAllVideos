name: ci

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

env:
  # Qt from aqtinstall (macOS/Windows) or the distribution (Linux)
  QT_VERSION: 6.8.3
  QT_MODULES: "qtmultimedia qtwebengine qtwebchannel qtpositioning qtserialport"

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
            cc: gcc
            cxx: g++
            generator: Ninja
            build_type: Debug
          - os: ubuntu-24.04
            compiler: gcc
            cc: gcc
            cxx: g++
            generator: Ninja
            build_type: Release
            package: true
          - os: ubuntu-24.04
            compiler: clang
            cc: clang
            cxx: clang++
            generator: Ninja
            build_type: Debug
          - os: ubuntu-24.04
            compiler: clang
            cc: clang
            cxx: clang++
            generator: Ninja
            build_type: Release
            # the AppImage from the GCC job is the one that gets published
          # macos-14 is Apple Silicon; the aqt Qt build there is arm64
          - os: macos-14
            compiler: appleclang
            generator: Ninja
            build_type: Debug
          - os: macos-14
            compiler: appleclang
            generator: Ninja
            build_type: Release
            package: true
          - os: windows-2022
            compiler: msvc
            generator: "Visual Studio 17 2022"
            build_type: Debug
          - os: windows-2022
            compiler: msvc
            generator: "Visual Studio 17 2022"
            build_type: Release
            package: true

    steps:
      - uses: actions/checkout@v7

      # ---- Qt ----

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libxkbcommon-dev libfontconfig1

      # The official Qt everywhere: Ubuntu 24.04's Qt 6.4.2 CMake package
      # references a multimedia plugin that the distribution does not ship
      # (get_target_property(): non-existent target ::QGstreamerMediaPlugin), so
      # the distribution Qt cannot configure this project. aqt also means the
      # same Qt version on all three platforms.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Set up MSVC environment
        if: matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # ---- build / test ----

      - name: Configure
        shell: bash
        run: |
          # single-config generators take the build type at configure time, the
          # Visual Studio generator at build time
          args=(-DQtWatchAllVideos2_ENABLE_IPO=OFF)
          if [ "${{ matrix.generator }}" = "Ninja" ]; then
            args+=("-DCMAKE_BUILD_TYPE=${{ matrix.build_type }}")
          fi
          if [ -n "${{ matrix.cc }}" ]; then
            args+=("-DCMAKE_C_COMPILER=${{ matrix.cc }}" "-DCMAKE_CXX_COMPILER=${{ matrix.cxx }}")
          fi
          if [ -n "${CMAKE_PREFIX_PATH:-}" ]; then
            args+=("-DCMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH")
          fi
          cmake -S . -B build -G "${{ matrix.generator }}" "${args[@]}"

      - name: Build
        shell: bash
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        shell: bash
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      # ---- package (Release only: these are what gets published) ----

      - name: Package (Linux AppImage)
        if: matrix.package && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaging/appdir/usr/bin
          cp build/src/app/QtWatchAllVideos2 packaging/appdir/usr/bin/

          base=https://github.com/linuxdeploy
          curl -sSL -o linuxdeploy \
            "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -sSL -o linuxdeploy-plugin-qt \
            "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-qt

          export QMAKE="$(command -v qmake)"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export NO_STRIP=1
          ./linuxdeploy --appdir packaging/appdir --plugin qt \
            --executable packaging/appdir/usr/bin/QtWatchAllVideos2 \
            --desktop-file packaging/linux/QtWatchAllVideos2.desktop \
            --icon-file packaging/linux/QtWatchAllVideos2.svg \
            --output appimage

          sha=$(git rev-parse --short=7 HEAD)
          mv QtWatchAllVideos2-x86_64.AppImage \
             "QtWatchAllVideos2-${sha}-linux-x86_64.AppImage"

      - name: Package (macOS .app)
        if: matrix.package && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=build/src/app/QtWatchAllVideos2.app
          macdeployqt "$app" -always-overwrite

          sha=$(git rev-parse --short=7 HEAD)
          arch=$(uname -m)
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "QtWatchAllVideos2-${sha}-macos-${arch}.zip"

      - name: Package (Windows exe + Qt runtime)
        if: matrix.package && runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "build/src/app/Release"
          windeployqt --no-translations --release "$out/QtWatchAllVideos2.exe"
          $sha = git rev-parse --short=7 HEAD
          Compress-Archive -Path "$out/*" -DestinationPath "QtWatchAllVideos2-$sha-windows-x64.zip"

      - name: Upload packaged binary
        if: matrix.package && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ runner.os }}
          path: |
            QtWatchAllVideos2-*.AppImage
            QtWatchAllVideos2-*.zip
          if-no-files-found: error

      - name: Upload packaged binary (Windows)
        if: matrix.package && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: binaries-Windows
          path: QtWatchAllVideos2-*.zip
          if-no-files-found: error

  # ---- publish ----

  pages:
    name: Publish downloads page and rolling CI release
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: downloads
          merge-multiple: true

      # The commit sha is dropped from the published names so that
      # releases/download/ci-latest/QtWatchAllVideos2-linux-x86_64.AppImage stays
      # a stable link; the page shows which commit it was built from.
      - name: Give the archives stable names
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          for path in sorted(Path("downloads").iterdir()):
              if path.is_file():
                  stable = re.sub(r"-[0-9a-f]{7}(?=-)", "", path.name)
                  if stable != path.name:
                      path.rename(path.with_name(stable))
                      print(f"{path.name} -> {stable}")
          PY

      - name: Update the rolling CI release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ci-latest
          name: Latest CI build
          body: |
            Automatically published from the latest successful build of `main`
            (commit ${{ github.sha }}).

            The download page lives at
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          files: downloads/*
          prerelease: true
          make_latest: "false"

      - name: Generate the download page
        run: python3 .github/scripts/make_download_page.py downloads site "${{ github.sha }}" "${{ github.ref_name }}"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          # a single orphan commit: the page is regenerated from scratch on
          # every push, there is nothing to keep in history
          force_orphan: true
          user_name: SnoutFirst
          user_email: snoutfirst@protonmail.com

  release-assets:
    name: Attach binaries to the GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: downloads
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: downloads/*
